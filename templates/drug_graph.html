<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة التفاعلات الدوائية — MedLink AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #e2e8f0;
            font-family: 'Cairo', 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            background: rgba(99,102,241,0.2);
            border: 1px solid rgba(99,102,241,0.4);
            color: #818cf8;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-btn:hover { background: rgba(99,102,241,0.4); }

        .legend {
            display: flex;
            gap: 20px;
            padding: 12px 32px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .legend-dot { width: 14px; height: 14px; border-radius: 50%; }

        .graph-container {
            width: 100%;
            height: calc(100vh - 130px);
            position: relative;
        }
        svg { width: 100%; height: 100%; }

        .tooltip {
            position: absolute;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(99,102,241,0.5);
            border-radius: 12px;
            padding: 14px;
            font-size: 0.85rem;
            max-width: 280px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            line-height: 1.6;
        }
        .tooltip.visible { opacity: 1; }
        .tooltip h4 { color: #818cf8; margin-bottom: 6px; font-size: 1rem; }
        .tooltip .severity-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: rgba(99,102,241,0.3); }

        .stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .stats span { color: #818cf8; font-weight: 600; }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <h1>🔗 شبكة التفاعلات الدوائية</h1>
    <div style="display:flex;gap:12px;align-items:center;">
        <span style="font-size:0.85rem;color:#94a3b8;">Drug Interaction Network — MedLink AI</span>
        <a href="/" class="back-btn">← الرئيسية</a>
    </div>
</div>

<div class="legend">
    <div class="legend-item">
        <div class="legend-dot" style="background:#ef4444;"></div>
        <span>تفاعل خطير (High)</span>
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#f59e0b;"></div>
        <span>تفاعل متوسط (Moderate)</span>
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#22c55e;"></div>
        <span>تفاعل خفيف (Low)</span>
    </div>
    <div class="legend-item">
        <div class="legend-dot" style="background:#818cf8;border-radius:3px;"></div>
        <span>● عقار (Node)</span>
    </div>
    <span style="color:#94a3b8;font-size:0.8rem;margin-right:auto;">اضغط على أي عقار أو خط للتفاصيل • اسحب للتحريك</span>
</div>

<div class="graph-container" id="graphContainer">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>جاري تحميل شبكة التفاعلات...</p>
    </div>
    <svg id="graphSvg"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="controls">
        <button class="ctrl-btn" onclick="zoomIn()" title="تكبير">+</button>
        <button class="ctrl-btn" onclick="zoomOut()" title="تصغير">−</button>
        <button class="ctrl-btn" onclick="resetZoom()" title="إعادة ضبط">⟳</button>
    </div>
    <div class="stats" id="stats" style="display:none;">
        <div>العقد: <span id="nodeCount">0</span></div>
        <div>الروابط: <span id="linkCount">0</span></div>
    </div>
</div>

<script>
const svg = d3.select('#graphSvg');
const container = document.getElementById('graphContainer');
const tooltip = document.getElementById('tooltip');
let simulation, zoomBehavior, g;

async function loadGraph() {
    try {
        const res = await fetch('/api/drug-graph-data');
        const data = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('stats').style.display = 'block';
        document.getElementById('nodeCount').textContent = data.nodes.length;
        document.getElementById('linkCount').textContent = data.links.length;

        if (!data.nodes.length) {
            document.getElementById('graphContainer').innerHTML += 
                '<p style="text-align:center;color:#94a3b8;margin-top:100px;">لا توجد بيانات تفاعلات متاحة</p>';
            return;
        }

        drawGraph(data);
    } catch (e) {
        document.getElementById('loading').innerHTML = 
            '<p style="color:#ef4444;">خطأ في تحميل البيانات. تأكد من تشغيل الخادم.</p>';
    }
}

function drawGraph(data) {
    const w = container.clientWidth;
    const h = container.clientHeight;

    zoomBehavior = d3.zoom()
        .scaleExtent([0.2, 3])
        .on('zoom', (e) => g.attr('transform', e.transform));

    svg.call(zoomBehavior);
    g = svg.append('g');

    // Arrow markers
    svg.append('defs').selectAll('marker')
        .data(['high', 'moderate', 'low'])
        .enter().append('marker')
        .attr('id', d => `arrow-${d}`)
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 22).attr('refY', 0)
        .attr('markerWidth', 6).attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', d => d === 'high' ? '#ef4444' : d === 'moderate' ? '#f59e0b' : '#22c55e');

    simulation = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(120))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(w / 2, h / 2))
        .force('collision', d3.forceCollide(35));

    // Links
    const link = g.append('g').selectAll('line')
        .data(data.links).enter().append('line')
        .attr('stroke', d => d.color || '#6366f1')
        .attr('stroke-width', d => d.severity === 'high' ? 3 : d.severity === 'moderate' ? 2 : 1.5)
        .attr('stroke-opacity', 0.7)
        .attr('marker-end', d => `url(#arrow-${d.severity})`)
        .style('cursor', 'pointer')
        .on('mouseover', function(event, d) {
            showTooltip(event, `
                <h4>⚡ تفاعل دوائي</h4>
                <div><b>${d.source.label || d.source.id}</b> + <b>${d.target.label || d.target.id}</b></div>
                <span class="severity-badge" style="background:${d.color}22;color:${d.color};border:1px solid ${d.color}44;">
                    ${d.severity === 'high' ? '🔴 خطير' : d.severity === 'moderate' ? '🟡 متوسط' : '🟢 خفيف'}
                </span>
            `);
        })
        .on('mouseout', hideTooltip);

    // Nodes
    const node = g.append('g').selectAll('g')
        .data(data.nodes).enter().append('g')
        .call(d3.drag()
            .on('start', dragStarted)
            .on('drag', dragged)
            .on('end', dragEnded))
        .style('cursor', 'grab')
        .on('mouseover', function(event, d) {
            showTooltip(event, `
                <h4>💊 ${d.label || d.id}</h4>
                <div style="color:#94a3b8;font-size:0.8rem;">اسحب لإعادة الترتيب</div>
            `);
        })
        .on('mouseout', hideTooltip);

    node.append('circle')
        .attr('r', 18)
        .attr('fill', d => d.group === 1 ? 'rgba(99,102,241,0.3)' : 'rgba(192,132,252,0.3)')
        .attr('stroke', d => d.group === 1 ? '#6366f1' : '#c084fc')
        .attr('stroke-width', 2);

    node.append('text')
        .text(d => (d.label || d.id).substring(0, 8))
        .attr('text-anchor', 'middle')
        .attr('dy', '0.35em')
        .attr('font-size', '9px')
        .attr('fill', '#e2e8f0')
        .attr('font-family', 'Inter, sans-serif');

    simulation.on('tick', () => {
        link
            .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
}

function showTooltip(event, html) {
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');
    tooltip.style.left = (event.pageX - container.getBoundingClientRect().left + 15) + 'px';
    tooltip.style.top = (event.pageY - container.getBoundingClientRect().top - 20) + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

function dragStarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragEnded(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
}

function zoomIn() { svg.transition().call(zoomBehavior.scaleBy, 1.3); }
function zoomOut() { svg.transition().call(zoomBehavior.scaleBy, 0.77); }
function resetZoom() { svg.transition().call(zoomBehavior.transform, d3.zoomIdentity); }

loadGraph();
</script>
</body>
</html>
